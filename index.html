<!DOCTYPE html>
<html lang="ko">
<head>
	<title>MoneyBook</title>
	<meta charset="UTF-8">
	<meta name="viewport" content="width=device-width, initial-scale=1">
	<meta name="theme-color" content="#0B0B0F">
	<link rel="manifest" href="manifest.json">
	<link rel="stylesheet" href="./style.css">
	<script src="https://code.jquery.com/jquery-3.7.1.min.js"></script>
	<script type="module" src="./js/firebase-config.js"></script>
	<script type="module" src="./js/auth.js"></script>
	<script type="module" src="./js/app.js"></script>
	<script src="./js/script.js" defer></script>
</head>
<body>

<div id="overlay"></div>

<div id="loginModal">
	<p class="txt_login_brand">Moneybook</p>
	<h2>로그인이 필요합니다</h2>
	<button type="button" id="googleLoginBtn">Google 로그인</button>
</div>

<div id="appContent">
	<aside class="nav_rail" aria-label="데스크톱 메뉴">
		<span class="logo_rail" aria-hidden="true">M</span>
		<button type="button" class="btn_rail btn_tab is_active" data-tab="calendar" aria-label="달력">
			<span class="icon_rail icon_rail_calendar"></span>
		</button>
		<button type="button" class="btn_rail btn_tab" data-tab="history" aria-label="내역">
			<span class="icon_rail icon_rail_list"></span>
		</button>
		<img class="img_avatar img_avatar_rail" id="userAvatarRail" alt="">
	</aside>

	<div class="wrap_moneybook">
		<header class="header_moneybook">
			<div class="box_header_mobile">
				<h1 class="tit_brand">Moneybook</h1>
			</div>

			<div class="box_header_desktop">
				<div class="box_month_heading">
					<h2 class="tit_month txt_month"></h2>
					<div class="box_month_pill">
						<button type="button" class="btn_month btn_month_prev" data-nav="prev" aria-label="이전 달"></button>
						<button type="button" class="btn_today" id="todayBtn">오늘</button>
						<button type="button" class="btn_month btn_month_next" data-nav="next" aria-label="다음 달"></button>
					</div>
				</div>
				<label class="box_search">
					<span class="icon_search" aria-hidden="true"></span>
					<input type="search" id="searchInput" placeholder="검색 (카테고리, 메모)">
				</label>
			</div>
		</header>

		<main class="main_moneybook">
			<div class="area_workspace">
				<section class="section_main">
					<div class="panel_tab panel_calendar is_active" data-panel="calendar">
						<section class="hero_balance" aria-label="이달 잔액">
							<p class="txt_hero_label">이달 잔액</p>
							<p class="txt_hero_total txt_amount_total">0원</p>
							<div class="box_hero_pills">
								<span class="pill_summary pill_income">수입 <em class="txt_amount_income">0</em></span>
								<span class="pill_summary pill_expense">지출 <em class="txt_amount_expense">0</em></span>
							</div>
						</section>

						<section class="card_bento_row" aria-label="월간 요약">
							<article class="card_bento card_bento_income">
								<span class="txt_bento_label">수입</span>
								<p class="txt_bento_amount txt_amount_income">0원</p>
								<p class="txt_bento_delta" id="incomeDelta"></p>
							</article>
							<article class="card_bento card_bento_expense">
								<span class="txt_bento_label">지출</span>
								<p class="txt_bento_amount txt_amount_expense">0원</p>
								<p class="txt_bento_delta" id="expenseDelta"></p>
							</article>
							<article class="card_bento card_bento_total">
								<span class="txt_bento_label">잔액</span>
								<p class="txt_bento_amount txt_amount_total">0원</p>
								<p class="txt_bento_delta" id="totalDelta"></p>
							</article>
						</section>

						<div class="box_month_nav">
							<div class="box_month_controls">
								<button type="button" class="btn_month btn_month_prev" data-nav="prev" aria-label="이전 달"></button>
								<h2 class="tit_month_nav txt_month"></h2>
								<button type="button" class="btn_month btn_month_next" data-nav="next" aria-label="다음 달"></button>
							</div>
							<button type="button" class="btn_day_view" id="dayViewBtn">내역보기</button>
						</div>

						<div class="box_calendar">
							<div class="head_calendar" aria-hidden="true">
								<span class="col_day col_day_sun">일</span>
								<span class="col_day">월</span>
								<span class="col_day">화</span>
								<span class="col_day">수</span>
								<span class="col_day">목</span>
								<span class="col_day">금</span>
								<span class="col_day col_day_sat">토</span>
							</div>
							<div class="grid_calendar" id="calendarBody" role="grid" aria-label="가계부 달력"></div>
						</div>
					</div>

					<div class="panel_tab panel_history" data-panel="history">
						<div class="header_history">
							<h2 class="tit_history">내역</h2>
							<button type="button" class="btn_history_filter" id="historyFilterToggle" aria-label="필터"></button>
						</div>

						<div class="box_period_chips" role="tablist" aria-label="조회 기간">
							<button type="button" class="btn_period is_active" data-period="this_month">이번 달</button>
							<button type="button" class="btn_period" data-period="last_month">지난 달</button>
							<button type="button" class="btn_period" data-period="this_year">올해</button>
							<button type="button" class="btn_period" data-period="custom">직접 설정</button>
						</div>

						<section class="card_history_overview" aria-label="조회기간 요약">
							<div class="item_history_overview">
								<span class="txt_history_overview_label txt_history_overview_label_income">수입</span>
								<p class="txt_history_overview_amount txt_history_amount_income" id="historySummaryIncome">0원</p>
							</div>
							<div class="item_history_overview">
								<span class="txt_history_overview_label txt_history_overview_label_expense">지출</span>
								<p class="txt_history_overview_amount txt_history_amount_expense" id="historySummaryExpense">0원</p>
							</div>
							<div class="item_history_overview">
								<span class="txt_history_overview_label txt_history_overview_label_total">잔액</span>
								<p class="txt_history_overview_amount txt_history_amount_total" id="historySummaryTotal">0원</p>
							</div>
						</section>

						<div class="box_history_filter" id="historyFilterPanel">
							<div class="layout_history_filter">
								<div class="col_history_filter col_history_filter_date">
									<span class="txt_filter_label">시작일</span>
									<input type="date" class="input_date_filter" id="historyStartDate" aria-label="조회 시작일">
								</div>
								<div class="col_history_filter col_history_filter_date">
									<span class="txt_filter_label">종료일</span>
									<input type="date" class="input_date_filter" id="historyEndDate" aria-label="조회 종료일">
								</div>
								<div class="col_history_filter col_history_filter_type">
									<span class="txt_filter_label">유형</span>
									<div class="box_history_type">
										<button type="button" class="btn_history_type is_active" data-history-type="all">전체</button>
										<button type="button" class="btn_history_type" data-history-type="income">수입</button>
										<button type="button" class="btn_history_type" data-history-type="expense">지출</button>
									</div>
								</div>
								<div class="col_history_filter col_history_filter_category" id="historyCategoryCol">
									<span class="txt_filter_label">카테고리</span>
									<select class="select_history_category" id="historyCategory" aria-label="카테고리 선택" disabled></select>
								</div>
							</div>
							<p class="txt_filter_error" id="historyFilterError">시작일은 종료일보다 이후일 수 없습니다.</p>
						</div>

						<div class="box_history_list scroll_area_modern">
							<div id="transactionList" class="list_history_grouped"></div>
							<p class="txt_empty" id="historyEmpty">선택한 기간의 내역이 없습니다.</p>
						</div>
					</div>
				</section>

				<div class="col_side">
					<div class="card_side">
						<div class="box_side_tabs" role="tablist" aria-label="날짜 내역 메뉴">
							<button type="button" class="btn_side_tab is_active" id="sideTabInput" data-side-tab="input" role="tab" aria-selected="true">내역 추가</button>
							<button type="button" class="btn_side_tab" id="sideTabPeek" data-side-tab="peek" role="tab" aria-selected="false">내역 보기</button>
						</div>

						<div class="box_side_panels">
					<section class="sheet_day_peek" id="dayPeek" aria-label="선택한 날짜 내역" data-side-panel="peek">
						<div class="header_day_peek">
							<h3 class="tit_day_peek" id="dayPeekTitle"></h3>
							<button type="button" class="btn_modal_close" id="dayPeekClose" aria-label="닫기">×</button>
						</div>
						<div class="box_day_peek_list scroll_area_modern" id="dayPeekList"></div>
						<p class="txt_empty txt_day_peek_empty" id="dayPeekEmpty">해당 날짜의 내역이 없습니다.</p>
						<button type="button" class="btn_day_peek_add" id="dayPeekAddBtn">이 날짜에 추가</button>
					</section>

					<aside class="aside_input is_side_active" id="inputFormPanel" data-side-panel="input">
					<div class="header_input_form">
						<h3 class="tit_input">내역 추가</h3>
						<button type="button" class="btn_modal_close btn_input_close" id="inputModalClose" aria-label="닫기">×</button>
					</div>

					<label class="btn_date_chip" id="dateChip" for="date">
						<span class="icon_date_chip" aria-hidden="true"></span>
						<span id="dateChipText">날짜 선택</span>
					</label>

					<select id="type" hidden aria-hidden="true">
						<option value="expense" selected>지출</option>
						<option value="income">수입</option>
					</select>

					<form class="form_input" action="#" method="post">
						<input type="date" class="input_date_hidden" id="date" name="date">

						<div class="box_amount_hero" id="amountHero">
							<input type="text" class="txt_amount_hero" id="amount" name="amount" value="" placeholder="0" inputmode="numeric" pattern="[0-9]*" autocomplete="off">
							<span class="txt_amount_hero_unit">원</span>
						</div>

						<div class="box_type_toggle">
							<button type="button" class="btn_type is_active" data-type="expense">지출</button>
							<button type="button" class="btn_type" data-type="income">수입</button>
						</div>

						<div class="box_category_pager">
							<button type="button" class="btn_category_nav" id="categoryPrevBtn" data-category-nav="prev" aria-label="이전 카테고리">‹</button>
							<div class="box_category_viewport">
								<div class="box_category_chips" id="categoryChips"></div>
							</div>
							<button type="button" class="btn_category_nav" id="categoryNextBtn" data-category-nav="next" aria-label="다음 카테고리">›</button>
						</div>
						<select id="category" name="category" hidden></select>

						<div class="box_field box_field_memo">
							<input type="text" class="input_field" id="memo" name="memo" placeholder="메모를 입력해주세요 (선택)" autocomplete="off">
						</div>

						<div class="box_keypad" id="amountKeypad" aria-label="숫자 키패드">
							<button type="button" class="btn_keypad" data-key="1">1</button>
							<button type="button" class="btn_keypad" data-key="2">2</button>
							<button type="button" class="btn_keypad" data-key="3">3</button>
							<button type="button" class="btn_keypad" data-key="4">4</button>
							<button type="button" class="btn_keypad" data-key="5">5</button>
							<button type="button" class="btn_keypad" data-key="6">6</button>
							<button type="button" class="btn_keypad" data-key="7">7</button>
							<button type="button" class="btn_keypad" data-key="8">8</button>
							<button type="button" class="btn_keypad" data-key="9">9</button>
							<button type="button" class="btn_keypad btn_keypad_zero" data-key="0">0</button>
							<button type="button" class="btn_keypad btn_keypad_back" data-key="back" aria-label="지우기">⌫</button>
						</div>

						<button type="button" class="btn_save" id="saveBtn">저장하기</button>
						<p class="txt_form_error" id="formErrorMsg">입력해주세요</p>
					</form>
				</aside>
						</div>
					</div>
				</div>
			</div>
		</main>
	</div>
</div>

<div id="inputModalOverlay" class="modal_overlay_input"></div>
<div id="dayPeekOverlay" class="modal_overlay_day"></div>

<nav class="nav_bottom" aria-label="주요 메뉴">
	<button type="button" class="btn_nav btn_tab is_active" data-tab="calendar">
		<span class="icon_nav icon_nav_calendar"></span>
		달력
	</button>
	<button type="button" class="btn_nav_add" id="openInputBtn" aria-label="내역 추가">+</button>
	<button type="button" class="btn_nav btn_tab" data-tab="history">
		<span class="icon_nav icon_nav_list"></span>
		내역
	</button>
</nav>

</body>
</html>
